name: pack

# 웹 실습 팩을 만들고 시험한 뒤 Releases에 올린다.
# 팩은 운영체제와 상관없이 하나라 Linux에서 한 번 만든다 (PostgreSQL 실행 파일은 학습자 컴퓨터에서 그 운영체제의 것을 넣는다).
# - main에 playground-pack이 바뀌어 올라오거나 손으로 실행하면 돈다
# - 이 판(playground-pack/package.json의 version)의 릴리스 pack-web-v<판>이 아직 없을 때만 올린다. 있으면 만들고 시험만 한다
on:
  push:
    branches: [main]
    # appium 팩과 상점 모바일 앱은 이 팩에 들어가지 않는다 (appium-pack.yml이 따로 만든다)
    paths:
      - "playground-pack/**"
      - "!playground-pack/appium/**"
      - "!playground-pack/mobile/**"
      - ".github/workflows/pack.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pack
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: playground-pack
    steps:
      - uses: actions/checkout@v4
      # 데스크톱 앱의 Electron 44는 Node 24다. 학습자 컴퓨터와 가까운 판으로 만들고 시험한다
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            playground-pack/package-lock.json
            playground-pack/backend/package-lock.json
            playground-pack/storefront/package-lock.json
      - run: npm ci --no-audit --no-fund
      # 상점 시험의 브라우저 (playwright-core 판에 맞는 Chromium)
      - run: npx playwright-core install --with-deps chromium
      - run: node build.mjs
      # 팩을 풀고 이 운영체제의 PostgreSQL을 넣어 켜기, 관리자 화면, 상점 담기, 초기화까지 해 본다
      - run: npm test
      - name: 팩 크기
        run: ls -l out/*.tar.gz && cat out/*.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: web-pack
          path: |
            playground-pack/out/*.tar.gz
            playground-pack/out/*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
      - name: 릴리스
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="pack-web-v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag 릴리스가 이미 있다. 올리지 않는다"
            exit 0
          fi
          gh release create "$tag" out/testhub-web-pack-"$version".tar.gz out/testhub-web-pack-"$version".tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "웹 실습 팩 $version" \
            --notes "실습 환경 웹 묶음 팩 (Medusa 2.18.0, 상점). 운영체제와 상관없이 하나이고, PostgreSQL은 학습자 컴퓨터에서 그 운영체제의 것을 넣는다. 라이선스 고지는 팩 안의 LICENSES.md"
